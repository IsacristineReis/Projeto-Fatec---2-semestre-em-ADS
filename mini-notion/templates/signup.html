<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela de criar conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="backgroundImages fhOXIb"
      style="background-image: url({{ url_for('static', filename='img/skyBackground.svg') }})"
    ></div>
    <!-- Header -->
    <div id="global-header">
      <div class="headerdiv">
        <div id="logoNote">
          <a href="{{ url_for('signup_page') }}" style="text-decoration: none; color: inherit">
            <img src="{{ url_for('static', filename='img/notas.png') }}" alt="logo da marca" /><span>mini-Notion</span>
          </a>
        </div>
        <div class="darkLight">
          <i class="bx bx-moon moon"></i>
          <i class="bx bx-sun sun"></i>
        </div>
      </div>
    </div>

    <!-- Formulário de login -->
    <div class="loginwrapper">
      <div class="warning">
        <div id="imageLogin">
          <img src="{{ url_for('static', filename='img/star.png') }}" alt="" />
        </div>
        <div id="textLogin">
          <h1 class="heading">
            Entre com a sua conta para acessar o bloco de notas
          </h1>
        </div>
      </div>
      <div class="container">
        <form class="form" action="#" method="post" id="signupForm">
          <div class="input-field">
            <input
              required
              autocomplete="off"
              type="text"
              name="text"
              id="username"
            />
            <label for="username">Nome</label>
          </div>
          <div class="input-field">
            <input
              required
              autocomplete="off"
              type="email"
              name="email"
              id="email"
            />
            <label for="email">E-mail</label>
          </div>
          <div class="input-field">
            <input
              required
              autocomplete="off"
              type="password"
              name="password"
              id="password"
            />
            <label for="password">Senha</label>
          </div>
          <div class="btn-container">
            <button class="btn_formLogin" type="submit">Criar uma conta</button>
          </div>
          <p id="formMessage" class="form-message"></p>
        </form>
        <div id="log_in">
          <p>Já tem uma conta?</p>
          <a href="{{ url_for('login_page') }}">
            <button class="btn_log_in" id="btn-login">Entrar</button>
          </a>
        </div>
      </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
