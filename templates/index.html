<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-Notion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="div-header">
      <header>
        <span class="logotipo">mini-Notion</span>
        <a href="" id="login"><button>Login</button></a>
      </header>
    </div>

    <!-- Criar uma anotação {Titulo, Conteúdo, adicionar nota} lista deletar e editar-->
    <!-- From Uiverse.io by mamyapro123 -->
    <div class="doodle-wrapper" style="border: 2px solid saddlebrown">
      <!-- CARD NUMBER 1 -->
      <div class="doodle-card-scene">
        <div class="doodle-card-inner">
          <div class="doodle-card-front">
            <div class="doodle-title">Bloco de notas</div>
            <form id="form-nota" action="#" method="post">
              <div class="doodle-input-wrapper">
                <input type="hidden" id="nota-id" />
                <input
                  class="doodle-input"
                  id="titulo-form"
                  name="titulo"
                  placeholder="Título"
                  type="text"
                />
              </div>
              <div class="doodle-input-wrapper">
                <input
                  class="doodle-input"
                  id="conteudo-form"
                  name="conteudo"
                  placeholder="Conteúdo"
                  type="text"
                />
              </div>
              <button class="doodle-btn" type="submit">Salvar nota</button>

              <hr />

              <div>
                <ul id="lista-notas">
                  <!-- JavaScript irá preencher com <li> -->
                </ul>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- ==== FIM DO FORMULÀRIO ==== -->

    <footer id="footer">Adeus</footer>

    <script src="script.js"></script>
  </body>
</html>
